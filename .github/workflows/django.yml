name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ github.sha }}-${{ github.run_id }}-ci-not-a-real-secret
      JWT_SIGNING_KEY: ${{ github.sha }}-${{ github.run_id }}-ci-not-a-real-jwt-key
      REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django checks
        run: python manage.py check --settings=config.settings

      - name: Deployment checks
        env:
          DEBUG: 'False'
          REDIS_URL: redis://127.0.0.1:6379/1
          ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level ERROR

      - name: No unapplied model changes
        run: python manage.py makemigrations --check --dry-run --settings=config.settings

      - name: Migrations apply cleanly
        run: python manage.py migrate --noinput --settings=config.settings

      - name: Tests
        run: python manage.py test --settings=config.settings